services:
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    container_name: kafka
    command:
      - redpanda start
      - --mode dev-container
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://kafka:9092,external://localhost:19092
      - --set redpanda.kafka_max_message_bytes=2000000
    ports:
      - "19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - backend

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.11.0
    ports:
      - "8088:8080"
    environment:
      - KAFKA_BROKERS=kafka:9092
    networks:
      - backend
    depends_on:
      - kafka

networks:
  backend:
    driver: bridge

volumes:
  redpanda-data:
